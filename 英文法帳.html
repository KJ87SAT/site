<style>

:root{
  --bg:#F6F7F9;
  --card:#FFFFFF;
  --border:#E3E6EA;
  --ink:#1A1D23;
  --ink-soft:#6B7280;
  --accent:#3D6BFF;
  --accent-soft:#EAEFFF;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--bg);
  font-family:'Noto Sans JP','Inter',sans-serif;
  color:var(--ink);
  padding:0 0 64px 0;
  min-height:100vh;
}

.wrap{
  max-width:640px;
  margin:0 auto;
  padding:0 20px;
}

header{
  padding:40px 0 24px 0;
}

h1{
  font-size:26px;
  font-weight:700;
  margin:0 0 6px 0;
  letter-spacing:0.01em;
}

.sub{
  font-size:14px;
  color:var(--ink-soft);
  margin:0;
}

nav{
  display:flex;
  gap:8px;
  margin:0 0 28px 0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:4px;
}

.tab{
  flex:1;
  font-family:'Noto Sans JP',sans-serif;
  font-size:14px;
  font-weight:500;
  background:none;
  border:none;
  padding:10px 16px;
  color:var(--ink-soft);
  cursor:pointer;
  border-radius:7px;
  transition:background 0.15s, color 0.15s;
}

.tab.active{
  color:var(--ink);
  background:var(--accent-soft);
}

.view{display:none;}
.view.active{display:block;}

label{
  display:block;
  font-size:12px;
  color:var(--ink-soft);
  letter-spacing:0.08em;
  margin:0 0 6px 0;
}

.field{margin-bottom:20px;}

textarea, input[type=text]{
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:2px;
  padding:12px 14px;
  font-size:15px;
  color:var(--ink);
  resize:vertical;
  font-family:'Inter','Noto Sans JP',sans-serif;
}

textarea.jp, input.jp{
  font-family:'Noto Sans JP',sans-serif;
}

textarea:focus, input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}

textarea{min-height:64px;}

.hint{font-size:12px;color:var(--ink-soft);margin-top:6px;}

button.save{
  font-family:'Noto Sans JP',sans-serif;
  font-weight:500;
  font-size:14px;
  background:var(--accent);
  color:#FFFFFF;
  border:none;
  padding:11px 26px;
  border-radius:8px;
  cursor:pointer;
}
button.save:hover{background:#2E58E0;}
button.save:active{transform:translateY(1px);}

.searchbox{position:relative;margin-bottom:24px;}
.searchbox input{padding-left:40px;font-size:16px;}
.searchbox::before{
  content:'';
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  border:2px solid var(--ink-soft);
  border-radius:50%;
  box-sizing:border-box;
}
.searchbox::after{
  content:'';
  position:absolute;
  left:25px;
  top:calc(50% + 7px);
  width:2px;
  height:8px;
  background:var(--ink-soft);
  transform:rotate(45deg);
  border-radius:1px;
}

.count{font-size:13px;color:var(--ink-soft);margin:0 0 16px 0;}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px;
  margin-bottom:12px;
  position:relative;
}

.card .eng{
  font-family:'Inter',sans-serif;
  font-size:16px;
  font-weight:500;
  line-height:1.5;
  margin:0 0 10px 0;
}

.card .jp{
  font-size:14px;
  color:var(--ink-soft);
  line-height:1.7;
  margin:0;
}

.card .jp mark{
  background:var(--accent-soft);
  color:var(--accent);
  padding:0 2px;
  border-radius:3px;
  font-weight:500;
}

.card .del{
  position:absolute;
  top:14px;
  right:14px;
  background:none;
  border:none;
  color:var(--ink-soft);
  font-size:12px;
  cursor:pointer;
  opacity:0;
  transition:opacity 0.15s;
}
.card:hover .del{opacity:1;}
.card .del:hover{color:var(--accent);}

.empty{
  text-align:center;
  padding:48px 0;
  color:var(--ink-soft);
  font-size:14px;
}

.recent-title{
  font-size:13px;
  font-weight:500;
  color:var(--ink-soft);
  margin:36px 0 14px 0;
  padding-top:24px;
  border-top:1px solid var(--border);
}
</style>
</head>
<body>
<div class="wrap">
  <header>

    <p class="sub">英文法と例文を記録して、日本語で検索できるノート</p>
  </header>

    <div class="searchbox">
      <input type="text" class="jp" id="in-search" placeholder="日本語で検索（例：完了形、〜したことがある）">
    </div>
    <p class="count" id="search-count"></p>
    <div id="search-list"></div>
  </div>

</div>

<script>
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, query){
  const safe = escapeHtml(text);
  if(!query) return safe;
  const q = escapeHtml(query);
  try{
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    return safe.replace(re, m => '<mark>'+m+'</mark>');
  }catch(e){ return safe; }
}

const LOCAL_PREFIX = 'eibunpo-note::';
const mem = {};
function rawGet(k){
  try{ const v = localStorage.getItem(LOCAL_PREFIX + k); if(v !== null) return v; }catch(e){}
  return (k in mem) ? mem[k] : null;
}
function rawSet(k, v){
  try{ localStorage.setItem(LOCAL_PREFIX + k, v); }catch(e){ mem[k] = v; }
}
function rawDel(k){
  try{ localStorage.removeItem(LOCAL_PREFIX + k); }catch(e){}
  delete mem[k];
}
function rawKeys(prefix){
  const keys = new Set(Object.keys(mem).filter(k => k.startsWith(prefix)));
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(LOCAL_PREFIX + prefix)) keys.add(k.slice(LOCAL_PREFIX.length));
    }
  }catch(e){}
  return Array.from(keys);
}
async function storageSet(key, value){ rawSet(key, value); return true; }
async function storageGet(key){ return rawGet(key); }
async function storageDelete(key){ rawDel(key); }
async function storageListKeys(prefix){ return rawKeys(prefix); }

// 内蔵データを初回だけ登録（その後の追加・削除は通常どおり）
function seedBuiltIn(){
  if(rawGet('seeded-v1')) return;
  const items = JSON.parse(document.getElementById('seed-data').textContent);
  for(const it of items){
    const id = 'entry:seed-' + it.created;
    if(rawGet(id) === null) rawSet(id, JSON.stringify({ eng: it.eng, jp: it.jp, created: it.created, id }));
  }
  rawSet('seeded-v1', '1');
}

async function getAllEntries(){
  const keys = await storageListKeys('entry:');
  if(!keys || keys.length === 0) return [];
  const entries = [];
  for(const key of keys){
    try{
      const value = await storageGet(key);
      if(value) entries.push(JSON.parse(value));
    }catch(e){}
  }
  entries.sort((a,b) => b.created - a.created);
  return entries;
}

async function deleteEntry(key){
  await storageDelete(key);
}

async function renderSearch(){
  const q = document.getElementById('in-search').value.trim();
  const entries = await getAllEntries();
  const filtered = q ? entries.filter(e => e.jp.toLowerCase().includes(q.toLowerCase())) : entries;
  const countEl = document.getElementById('search-count');
  const listEl = document.getElementById('search-list');
  countEl.textContent = q ? filtered.length + ' 件見つかりました' : entries.length + ' 件登録済み';
  if(filtered.length === 0){
    listEl.innerHTML = '<div class="empty">' + (q ? '一致する項目がありません' : 'まだ何も登録されていません') + '</div>';
    return;
  }
  listEl.innerHTML = filtered.map(e => cardHtml(e, q)).join('');
  attachDeleteHandlers(listEl);
}

function cardHtml(e, query){
  return '<div class="card" data-key="' + e.id + '">' +
    '<button class="del" data-id="' + e.id + '" aria-label="削除">削除</button>' +
    '<p class="eng">' + escapeHtml(e.eng) + '</p>' +
    '<p class="jp">' + highlight(e.jp, query) + '</p>' +
    '</div>';
}

function attachDeleteHandlers(container){
  container.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', async (ev) => {
      const id = ev.target.dataset.id;
      if(!id) return;
      await deleteEntry(id);
      renderSearch();
    });
  });
}

let searchTimer;
document.getElementById('in-search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderSearch, 150);
});

(async function init(){
  seedBuiltIn();
  await renderSearch();
})();

</script>
